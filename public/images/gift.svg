<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="An open book with light rising from its pages.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#2ee6c8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2ee6c8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2ee6c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7cff9a" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#070b14"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- light rising from the pages -->
  <g stroke="url(#rise)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M800 610 V 300"/>
    <path d="M712 640 C 690 540 700 470 736 392"/>
    <path d="M888 640 C 910 540 900 470 864 392"/>
    <path d="M640 668 C 590 590 580 520 600 452"/>
    <path d="M960 668 C 1010 590 1020 520 1000 452"/>
  </g>
  <g fill="#7cff9a">
    <circle cx="800" cy="272" r="7"/>
    <circle cx="736" cy="364" r="5" fill="#2ee6c8"/>
    <circle cx="864" cy="364" r="5" fill="#2ee6c8"/>
    <circle cx="600" cy="424" r="4" fill="#2ee6c8" opacity="0.8"/>
    <circle cx="1000" cy="424" r="4" fill="#2ee6c8" opacity="0.8"/>
  </g>

  <!-- the open book -->
  <g stroke="#2ee6c8" stroke-width="6" fill="#0d1520" stroke-linejoin="round">
    <path d="M420 700 C 540 660 700 660 800 706 C 900 660 1060 660 1180 700 L 1180 790 C 1060 750 900 750 800 796 C 700 750 540 750 420 790 Z"/>
  </g>
  <g stroke="#2ee6c8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M800 706 V 796"/>
  </g>
  <!-- text lines, left page -->
  <g stroke="#c5d5de" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <path d="M486 726 C 560 706 660 706 744 732"/>
    <path d="M486 750 C 560 730 660 730 744 756"/>
    <path d="M486 774 C 556 755 646 755 726 778"/>
  </g>
  <!-- text lines, right page -->
  <g stroke="#c5d5de" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <path d="M1114 726 C 1040 706 940 706 856 732"/>
    <path d="M1114 750 C 1040 730 940 730 856 756"/>
    <path d="M1114 774 C 1044 755 954 755 874 778"/>
  </g>
</svg>
